name: Run Selenium Tests

on:
  push:
    branches:
      - development

  workflow_dispatch:
    inputs:
      tests:
        description: 'Name of the test class to run (e.g., MyClassName)'
        required: false
        default: ''
      tests_suite:
        description: 'Path to the TestNG suite XML file (e.g., path/to/your_testng.xml)'
        required: false
        default: ''
      browser:
        description: 'Browser to use for tests'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BROWSER: ${{ github.event.inputs.browser || 'chrome' }}
      TESTS: ${{ github.event.inputs.tests }}
      TESTS_SUITE: ${{ github.event.inputs.tests_suite }}
      SELENIUM_GRID_URL: http://localhost:4444/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Start Selenium Grid
        run: |
          docker compose -f docker-compose.yml up -d
          echo "Waiting for Selenium Grid to be ready..."
          for i in {1..10}; do
            if curl -s http://localhost:4444/status | grep -q '"ready":true'; then
              echo "Grid is ready" && break
            fi
            echo "Waiting for Grid..."
            sleep 5
          done
          # after the loop
          if ! curl -s http://localhost:4444/status | grep -q '"ready":true'; then
            echo "❌ Selenium Grid failed to start" >&2
            exit 1
          fi

      - name: Install dependencies
        run: mvn install -DskipTests

      - name: Run Tests
        run: |
          if [ "$TESTS" != "" ]; then
            mvn clean -Dtest=$TESTS -Dbrowser=$BROWSER test -DremoteURL="$SELENIUM_GRID_URL"
          elif [ "TESTS_SUITE" != "" ]; then
            mvn clean test -DsuiteXmlFile="$TESTS_SUITE" -Dbrowser="$BROWSER" -DremoteURL="$SELENIUM_GRID_URL"
          else
            mvn clean test -DremoteURL="$SELENIUM_GRID_URL"
          fi

      - name: Install Allure
        if: always()
        run: |
          ALLURE_VERSION=2.29.0
          wget https://github.com/allure-framework/allure2/releases/download/$ALLURE_VERSION/allure-$ALLURE_VERSION.tgz
          tar -zxvf allure-$ALLURE_VERSION.tgz
          sudo mv allure-$ALLURE_VERSION /usr/local/bin/allure
          echo "/usr/local/bin/allure/bin" >> $GITHUB_PATH

      - name: Generate Allure Report
        if: always()
        run: allure generate --single-file target/allure-results --clean -o allure-report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-tests-report
          path: allure-report