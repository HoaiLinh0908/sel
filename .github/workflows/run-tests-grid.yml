name: Run Selenium Tests on Grid

on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Name of the test class to run (e.g., MyClassName)'
        required: false
        default: ''
      tests_suite:
        description: 'Path to the TestNG suite XML file (e.g., path/to/your_testng.xml)'
        required: false
        default: ''
      browser:
        description: 'Browser to use for tests'
        required: true
        default: 'chrome'
        type: choice
        options:
          - all
          - chrome
          - firefox
          - edge

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set_browser.outputs.matrix }}
    steps:
        - name: Set browser matrix
          id: set_browser
          run: |
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.browser }}" != "all" ]]; then
              echo "matrix=[\"${{ github.event.inputs.browser }}\"]" >> $GITHUB_OUTPUT
            else
              echo 'matrix=["chrome","firefox","edge"]' >> $GITHUB_OUTPUT
            fi

  run-tests:
    runs-on: ubuntu-latest
    needs: set-matrix
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    env:
      BROWSER: ${{ matrix.browser }}
      TESTS: ${{ github.event.inputs.tests }}
      TESTS_SUITE: ${{ github.event.inputs.tests_suite }}
      SELENIUM_GRID_URL: http://localhost:4444
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start local The Internet
        run: scripts/start_local_the_internet.sh

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install project deps
        run: mvn install -DskipTests

      - name: Start Selenium Grid
        env:
          SELENIUM_STATUS_URL: ${{ env.SELENIUM_GRID_URL }}/status
        run: |
          chmod +x scripts/check_grid_start.sh
          scripts/check_grid_start.sh

      - name: Run Tests
        run: |
          echo "TESTS: $TESTS"
          echo "TESTS_SUITE: $TESTS_SUITE"
          echo "BROWSER: $BROWSER"
          if [ "$TESTS" != "" ]; then
            mvn clean -Dtest=$TESTS test -DremoteURL="$SELENIUM_GRID_URL"
          elif [ "$TESTS_SUITE" != "" ]; then
            mvn clean test -DsuiteXmlFile="$TESTS_SUITE" -DremoteURL="$SELENIUM_GRID_URL"
          else
            mvn clean test -Dparallel=classes -DthreadCount=2 -DremoteURL="$SELENIUM_GRID_URL"
          fi

      - name: Install Allure
        if: always()
        run: |
          ALLURE_VERSION=2.29.0
          wget https://github.com/allure-framework/allure2/releases/download/$ALLURE_VERSION/allure-$ALLURE_VERSION.tgz
          tar -zxvf allure-$ALLURE_VERSION.tgz
          sudo mv allure-$ALLURE_VERSION /usr/local/bin/allure
          echo "/usr/local/bin/allure/bin" >> $GITHUB_PATH

      - name: Generate Allure Report
        if: always()
        run: allure generate --single-file target/allure-results --clean -o allure-report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-tests-report-${{ env.BROWSER }}
          path: allure-report