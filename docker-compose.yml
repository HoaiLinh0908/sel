version: "3.7"
services:
  selenium-hub:
    image: selenium/hub:4.29.0
    container_name: selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"

  node-1:
    image: selenium/node-chrome:4.29.0
    platform: linux/amd64
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_NODE_ENABLE_MANAGED_DOWNLOADS=true

  node-2:
    image: selenium/node-chrome:4.29.0
    platform: linux/amd64
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_NODE_ENABLE_MANAGED_DOWNLOADS=true
